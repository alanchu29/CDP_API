<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CDP Cerberus Query</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0f1a;
    --bg-elevated: #0f1726;
    --surface: #121c2e;
    --surface-hover: #182541;
    --border: #22314b;
    --border-strong: #2d4066;
    --text: #e4ecf8;
    --text-dim: #9db0c9;
    --text-faint: #647894;
    --accent: #4ea1ff;
    --accent-dim: #2f81f7;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Source Code Pro", Consolas, monospace;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 20px 64px; }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 22px 0 18px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 22px;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .brand h1 { margin: 0; font-size: 1.25rem; font-weight: 650; letter-spacing: -0.01em; }
  .brand .sub { color: var(--text-faint); font-size: 0.82rem; }

  .seg {
    display: inline-flex;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 3px;
    gap: 3px;
  }
  .seg button {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--text-dim);
    font: inherit;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 6px 14px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--accent-dim); color: #fff; }
  .seg button[data-env="dev"][aria-pressed="true"] { background: #b8730f; }

  /* ---------- Query panel ---------- */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
  }
  .field-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 14px;
    margin-bottom: 14px;
  }
  label.lbl {
    display: block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 6px;
  }
  select, textarea, input[type="search"] {
    width: 100%;
    background: var(--bg-elevated);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 9px 11px;
    font: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  select:focus, textarea:focus, input:focus {
    outline: 0;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(78, 161, 255, 0.16);
  }
  textarea {
    font-family: var(--mono);
    font-size: 0.86rem;
    line-height: 1.6;
    resize: vertical;
    min-height: 92px;
  }
  .sn-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
  }
  .sn-head .lbl { margin-bottom: 0; }
  .lbl .opt {
    font-weight: 500;
    letter-spacing: 0;
    text-transform: none;
    opacity: 0.7;
  }
  .msg.warn { background: rgba(255, 196, 87, 0.08); border-color: rgba(255, 196, 87, 0.35); color: #ffd98a; }
  .sn-count { font-size: 0.76rem; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .sn-count b { color: var(--accent); font-weight: 700; }

  .actions { display: flex; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .hint { font-size: 0.76rem; color: var(--text-faint); margin-left: auto; }
  kbd {
    font-family: var(--mono);
    font-size: 0.72rem;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 1px 5px;
    color: var(--text-dim);
  }

  button.btn {
    appearance: none;
    font: inherit;
    font-weight: 600;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg-elevated);
    color: var(--text);
    padding: 8px 14px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    white-space: nowrap;
  }
  button.btn:hover:not(:disabled) { background: var(--surface-hover); border-color: var(--border-strong); }
  button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
  button.btn.primary {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: #fff;
    padding: 9px 22px;
  }
  button.btn.primary:hover:not(:disabled) { background: var(--accent); }
  button.btn.sm { padding: 5px 10px; font-size: 0.8rem; }

  .spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -2px;
    margin-right: 7px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Messages ---------- */
  .msg {
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: var(--radius);
    border: 1px solid;
    font-size: 0.88rem;
  }
  .msg.error { background: rgba(255, 123, 114, 0.09); border-color: rgba(255, 123, 114, 0.4); color: #ffb3ae; }
  .msg.empty { background: rgba(255, 196, 87, 0.08); border-color: rgba(255, 196, 87, 0.35); color: #ffd98a; }
  .msg pre {
    margin: 7px 0 0;
    font-family: var(--mono);
    font-size: 0.76rem;
    white-space: pre-wrap;
    word-break: break-all;
    opacity: 0.8;
    max-height: 160px;
    overflow: auto;
  }

  /* ---------- Results ---------- */
  .results { margin-top: 26px; }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .summary { font-size: 0.88rem; color: var(--text-dim); }
  .summary b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
  .summary .sep { color: var(--border-strong); margin: 0 7px; }
  .toolbar .grow { flex: 1 1 180px; max-width: 320px; }
  .toolbar input[type="search"] { padding: 6px 10px; font-size: 0.85rem; }

  .dropdown { position: relative; }
  .dropdown-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 40;
    min-width: 230px;
    max-height: 340px;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 7px;
    box-shadow: 0 14px 38px rgba(0, 0, 0, 0.55);
  }
  .dropdown-menu label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 7px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.83rem;
  }
  .dropdown-menu label:hover { background: var(--surface-hover); }
  .dropdown-menu .divider { height: 1px; background: var(--border); margin: 6px 2px; }
  .dropdown-menu .mini { display: flex; gap: 6px; padding: 2px 5px 6px; }

  .table-scroll {
    overflow: auto;
    max-height: 68vh;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg-elevated);
  }
  table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 0.83rem; }
  thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: #16233a;
    color: var(--text-dim);
    text-align: left;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 9px 12px;
    border-bottom: 1px solid var(--border-strong);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  thead th:hover { color: var(--text); }
  thead th .arrow { opacity: 0.45; margin-left: 4px; font-size: 0.85em; }
  tbody td {
    padding: 8px 12px;
    border-bottom: 1px solid rgba(34, 49, 75, 0.6);
    max-width: 260px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: var(--mono);
    font-size: 0.8rem;
  }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: var(--surface-hover); }
  tbody tr:last-child td { border-bottom: 0; }
  .null { color: var(--text-faint); font-style: italic; opacity: 0.75; }
  .num { color: #90f2b0; }
  .bool { color: #d6b3ff; font-weight: 700; }

  .empty-state {
    padding: 52px 20px;
    text-align: center;
    color: var(--text-faint);
    border: 1px dashed var(--border);
    border-radius: 12px;
    font-size: 0.9rem;
  }

  pre.json {
    margin: 0;
    padding: 16px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: auto;
    max-height: 68vh;
    font-family: var(--mono);
    font-size: 0.8rem;
    line-height: 1.55;
    white-space: pre;
  }
  .jk { color: #7fd1ff; }
  .js { color: #ffd39b; }
  .jn { color: #90f2b0; }
  .jb { color: #d6b3ff; }
  .ju { color: var(--text-faint); font-style: italic; }

  /* ---------- Detail modal ---------- */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(4, 8, 16, 0.75);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    width: min(880px, 100%);
    max-height: 86vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
  }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--border);
  }
  .modal-head h2 { margin: 0; font-size: 0.98rem; font-weight: 650; }
  .modal-head .sn { font-family: var(--mono); color: var(--accent); font-size: 0.86rem; }
  .modal-body { overflow-y: auto; padding: 6px 18px 18px; }
  .kv {
    display: grid;
    grid-template-columns: minmax(150px, 220px) 1fr;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(34, 49, 75, 0.55);
    align-items: start;
  }
  .kv:last-child { border-bottom: 0; }
  .kv .k { color: #7fd1ff; font-family: var(--mono); font-size: 0.78rem; word-break: break-all; padding-top: 2px; }
  .kv .v {
    font-family: var(--mono);
    font-size: 0.78rem;
    word-break: break-all;
    white-space: pre-wrap;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .kv .v > span { flex: 1; min-width: 0; }
  .kv .v.long > span {
    max-height: 120px;
    overflow-y: auto;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 7px 9px;
  }

  .close-x {
    appearance: none;
    background: transparent;
    border: 0;
    color: var(--text-faint);
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    padding: 3px 7px;
    border-radius: 6px;
  }
  .close-x:hover { color: var(--text); background: var(--surface-hover); }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%) translateY(14px);
    background: #16233a;
    border: 1px solid var(--border-strong);
    color: var(--text);
    padding: 10px 18px;
    border-radius: var(--radius);
    font-size: 0.86rem;
    font-weight: 600;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s, transform 0.18s;
    z-index: 200;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.ok { border-color: rgba(70, 217, 138, 0.5); }
  #toast.err { border-color: rgba(255, 123, 114, 0.5); }

  footer {
    margin-top: 40px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    color: var(--text-faint);
    font-size: 0.78rem;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  footer code { font-family: var(--mono); color: var(--text-dim); }

  @media (max-width: 640px) {
    .wrap { padding: 0 14px 48px; }
    .toolbar .grow { max-width: none; }
    .kv { grid-template-columns: 1fr; gap: 4px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <h1>CDP Cerberus Query</h1>
      <span class="sub">Wiwynn &middot; sn_info</span>
    </div>
    <div class="seg" role="group" aria-label="Environment">
      <button type="button" data-env="prd" aria-pressed="true">PRD</button>
      <button type="button" data-env="dev" aria-pressed="false">DEV</button>
    </div>
  </header>

  <section class="panel">
    <div class="field-row">
      <div>
        <label class="lbl" for="site">Site <span class="opt">選填</span></label>
        <select id="site">
          <option value="">（不限廠區）</option>
          <option>WCZ</option><option>WYMY</option>
          <option selected>WYMX</option><option>WYTN</option>
          <option>WYMUS</option><option>WYLZ</option>
        </select>
      </div>
      <div>
        <label class="lbl" for="type">Type</label>
        <select id="type">
          <option value="overlake">overlake (Celestial Peak, Glacier Peak)</option>
          <option value="agilex">agilex (Glacier Peak)</option>
          <option value="m1120" selected>m1120</option>
          <option value="SoC">SoC</option>
          <option value="CaP">CaP</option>
          <option value="c41ae">c41ae</option>
        </select>
      </div>
    </div>

    <div class="sn-head">
      <label class="lbl" for="sn">Serial Numbers</label>
      <span class="sn-count" id="snCount">0 組</span>
    </div>
    <textarea id="sn" rows="4" spellcheck="false"
      placeholder="一行一組，也可用逗號或空白分隔（區分大小寫）&#10;留空則改查「尚未下載金鑰」的待處理佇列"></textarea>

    <div class="actions">
      <button type="button" class="btn primary" id="send">查詢</button>
      <button type="button" class="btn" id="clear">清空</button>
      <span class="hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> 送出</span>
    </div>

    <div id="message"></div>
  </section>

  <section class="results" id="results" hidden>
    <div class="toolbar">
      <div class="summary" id="summary"></div>
      <div class="grow">
        <input type="search" id="filter" placeholder="篩選所有欄位…" autocomplete="off">
      </div>
      <div class="dropdown">
        <button type="button" class="btn sm" id="colsBtn">欄位 &#9662;</button>
        <div class="dropdown-menu" id="colsMenu" hidden></div>
      </div>
      <div class="seg" role="group" aria-label="View">
        <button type="button" data-view="table" aria-pressed="true">表格</button>
        <button type="button" data-view="json" aria-pressed="false">JSON</button>
      </div>
      <button type="button" class="btn sm" id="csvBtn">匯出 CSV</button>
      <button type="button" class="btn sm" id="copyBtn">複製 JSON</button>
    </div>

    <div id="tableView">
      <div class="table-scroll"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    </div>
    <div id="jsonView" hidden><pre class="json" id="jsonPre"></pre></div>
    <div id="noMatch" class="empty-state" hidden>沒有符合篩選條件的記錄。</div>
  </section>

  <footer>
    <span>Wiwynn Corporation &middot; Internal Tool &middot; Dixon Chu</span>
    <span>Endpoint: <code id="epLabel"></code></span>
  </footer>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const LONG_VALUE_CHARS = 120;   // columns wider than this are hidden by default
  const CELL_TRUNCATE = 60;

  const state = {
    env: 'prd',
    records: [],
    columns: [],              // [{key, hidden, long}]
    sort: { key: null, dir: 1 },
    filter: '',
    view: 'table',
    lastQuery: null,
  };

  /* ---------- helpers ---------- */

  function toast(text, ok = true) {
    const el = $('toast');
    el.textContent = text;
    el.className = 'show ' + (ok ? 'ok' : 'err');
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.className = ''; }, 2200);
  }

  function store(key, value) {
    try {
      if (value === undefined) return localStorage.getItem('cdp.' + key);
      localStorage.setItem('cdp.' + key, value);
    } catch { /* private mode or blocked storage — non-essential */ }
    return null;
  }

  function parseSns(text) {
    const seen = new Set();
    return text.split(/[\s,;]+/).map((s) => s.trim()).filter((s) => {
      if (!s || seen.has(s)) return false;
      seen.add(s);
      return true;
    });
  }

  function endpoint() {
    return 'https://apim.wiwynn.com/nifi/' + state.env + '/api/cerberus/v1/sn_info';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* ---------- env / view toggles ---------- */

  document.querySelectorAll('.seg [data-env]').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.env = btn.dataset.env;
      document.querySelectorAll('.seg [data-env]').forEach((b) => {
        b.setAttribute('aria-pressed', String(b === btn));
      });
      store('env', state.env);
      $('epLabel').textContent = endpoint();
      resetResults();
    });
  });

  document.querySelectorAll('.seg [data-view]').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.view = btn.dataset.view;
      document.querySelectorAll('.seg [data-view]').forEach((b) => {
        b.setAttribute('aria-pressed', String(b === btn));
      });
      render();
    });
  });

  /* ---------- inputs ---------- */

  $('sn').addEventListener('input', () => {
    const n = parseSns($('sn').value).length;
    $('snCount').innerHTML = n ? '<b>' + n + '</b> 組' : '0 組';
  });

  $('sn').addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runQuery(); }
  });

  ['site', 'type'].forEach((id) => {
    $(id).addEventListener('change', () => { store(id, $(id).value); resetResults(); });
  });

  $('clear').addEventListener('click', () => {
    $('sn').value = '';
    $('sn').dispatchEvent(new Event('input'));
    resetResults();
    $('sn').focus();
  });

  $('send').addEventListener('click', runQuery);

  /* ---------- query ---------- */

  function resetResults() {
    state.records = [];
    state.columns = [];
    state.filter = '';
    state.sort = { key: null, dir: 1 };
    $('filter').value = '';
    $('results').hidden = true;
    $('message').innerHTML = '';
  }

  function showMessage(kind, title, detail) {
    $('message').innerHTML =
      '<div class="msg ' + kind + '"><div>' + escapeHtml(title) + '</div>' +
      (detail ? '<pre>' + escapeHtml(detail) + '</pre>' : '') + '</div>';
  }

  async function runQuery() {
    const btn = $('send');
    const sn = parseSns($('sn').value);
    const body = { env: state.env, site: $('site').value, type: $('type').value, sn };

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>查詢中…';
    $('message').innerHTML = '';

    try {
      const res = await fetch('/api/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => null);

      if (!res.ok) {
        const err = (data && data.error) || ('HTTP ' + res.status);
        showMessage('error', '查詢失敗：' + err, data && data.upstreamBody);
        resultsOff();
        return;
      }

      state.records = Array.isArray(data.records) ? data.records : [];
      state.lastQuery = Object.assign({}, body, { elapsedMs: data.elapsedMs });

      if (!state.records.length) {
        showMessage('empty', sn.length
          ? '查無資料 —— API 以 200 回應，但沒有任何符合的記錄。'
          : '查無資料 —— 未指定 SN 時，只會回傳「尚未下載金鑰」的待處理記錄，目前該佇列是空的。');
        resultsOff();
        return;
      }

      // The upstream caps "all"-filtered queries at 1000 rows without saying so.
      if (data.truncated) {
        showMessage('warn',
          `⚠ 結果可能不完整 —— 回傳筆數剛好等於上限 ${data.cap} 筆，代表資料可能被截斷。` +
          '請縮小查詢範圍（指定較少的 SN），或改用未指定 SN 的待處理佇列模式逐批處理。');
      }

      buildColumns();
      $('results').hidden = false;
      render();
    } catch (err) {
      showMessage('error', '無法連線到 proxy：' + err.message);
      resultsOff();
    } finally {
      btn.disabled = false;
      btn.textContent = '查詢';
    }
  }

  function resultsOff() {
    state.records = [];
    $('results').hidden = true;
  }

  /* ---------- columns ---------- */

  function buildColumns() {
    const keys = [];
    const seen = new Set();
    const maxLen = {};

    for (const rec of state.records) {
      for (const k of Object.keys(rec)) {
        if (!seen.has(k)) { seen.add(k); keys.push(k); }
        const len = rec[k] == null ? 0 : String(rec[k]).length;
        if (len > (maxLen[k] || 0)) maxLen[k] = len;
      }
    }

    // Certificates and keys are hundreds of characters long; showing them as
    // columns makes the table unreadable, and the row detail shows them in full.
    state.columns = keys.map((key) => ({
      key,
      long: (maxLen[key] || 0) > LONG_VALUE_CHARS,
      hidden: (maxLen[key] || 0) > LONG_VALUE_CHARS,
    }));

    renderColsMenu();
  }

  function renderColsMenu() {
    const menu = $('colsMenu');
    menu.innerHTML =
      '<div class="mini">' +
      '<button type="button" class="btn sm" data-all="1">全選</button>' +
      '<button type="button" class="btn sm" data-all="0">全不選</button>' +
      '</div><div class="divider"></div>' +
      state.columns.map((c, i) =>
        '<label><input type="checkbox" data-i="' + i + '" ' + (c.hidden ? '' : 'checked') + '>' +
        '<span>' + escapeHtml(c.key) +
        (c.long ? ' <span style="opacity:.5">(長)</span>' : '') + '</span></label>'
      ).join('');

    menu.querySelectorAll('input[data-i]').forEach((cb) => {
      cb.addEventListener('change', () => {
        state.columns[+cb.dataset.i].hidden = !cb.checked;
        render();
      });
    });
    menu.querySelectorAll('[data-all]').forEach((b) => {
      b.addEventListener('click', () => {
        const hide = b.dataset.all === '0';
        state.columns.forEach((c) => { c.hidden = hide; });
        renderColsMenu();
        render();
      });
    });
  }

  $('colsBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    $('colsMenu').hidden = !$('colsMenu').hidden;
  });
  document.addEventListener('click', (e) => {
    if (!$('colsMenu').hidden && !$('colsMenu').contains(e.target)) $('colsMenu').hidden = true;
  });

  /* ---------- filter / sort ---------- */

  $('filter').addEventListener('input', () => {
    state.filter = $('filter').value.trim().toLowerCase();
    render();
  });

  function visibleRows() {
    let rows = state.records;

    if (state.filter) {
      const cols = state.columns.filter((c) => !c.hidden).map((c) => c.key);
      rows = rows.filter((r) => cols.some((k) =>
        r[k] != null && String(r[k]).toLowerCase().includes(state.filter)));
    }

    if (state.sort.key) {
      const key = state.sort.key;
      const dir = state.sort.dir;
      rows = rows.slice().sort((a, b) => {
        const av = a[key];
        const bv = b[key];
        if (av == null && bv == null) return 0;
        if (av == null) return 1;          // nulls sort last regardless of direction
        if (bv == null) return -1;
        const an = Number(av);
        const bn = Number(bv);
        if (av !== '' && bv !== '' && !Number.isNaN(an) && !Number.isNaN(bn)) return (an - bn) * dir;
        return String(av).localeCompare(String(bv)) * dir;
      });
    }
    return rows;
  }

  /* ---------- render ---------- */

  function render() {
    const rows = visibleRows();
    const snCount = new Set(state.records.map((r) => r.SN).filter(Boolean)).size;
    const ms = state.lastQuery ? state.lastQuery.elapsedMs : 0;

    $('summary').innerHTML =
      '<b>' + state.records.length + '</b> 筆記錄' +
      (snCount ? '<span class="sep">·</span><b>' + snCount + '</b> 個 SN' : '') +
      (state.filter ? '<span class="sep">·</span>篩出 <b>' + rows.length + '</b>' : '') +
      '<span class="sep">·</span>' + ms + ' ms';

    const isTable = state.view === 'table';
    $('tableView').hidden = !isTable || rows.length === 0;
    $('jsonView').hidden = isTable;
    $('noMatch').hidden = !(isTable && rows.length === 0);

    if (isTable) renderTable(rows);
    else $('jsonPre').innerHTML = highlightJson(rows);
  }

  function renderTable(rows) {
    const cols = state.columns.filter((c) => !c.hidden);

    $('thead').innerHTML = '<tr>' + cols.map((c) => {
      const active = state.sort.key === c.key;
      const arrow = active ? (state.sort.dir === 1 ? '&#9650;' : '&#9660;') : '&#8645;';
      return '<th data-key="' + escapeHtml(c.key) + '">' + escapeHtml(c.key) +
        '<span class="arrow">' + arrow + '</span></th>';
    }).join('') + '</tr>';

    $('thead').querySelectorAll('th').forEach((th) => {
      th.addEventListener('click', () => {
        const key = th.dataset.key;
        state.sort = state.sort.key === key
          ? { key: key, dir: state.sort.dir * -1 }
          : { key: key, dir: 1 };
        render();
      });
    });

    $('tbody').innerHTML = rows.map((r, i) =>
      '<tr data-i="' + i + '">' + cols.map((c) => '<td>' + cellHtml(r[c.key]) + '</td>').join('') + '</tr>'
    ).join('');

    $('tbody').querySelectorAll('tr').forEach((tr) => {
      tr.addEventListener('click', () => openDetail(rows[+tr.dataset.i]));
    });
  }

  function cellHtml(v) {
    if (v === null || v === undefined) return '<span class="null">null</span>';
    if (typeof v === 'number') return '<span class="num">' + v + '</span>';
    if (typeof v === 'boolean') return '<span class="bool">' + v + '</span>';
    const s = typeof v === 'object' ? JSON.stringify(v) : String(v);
    if (s === '') return '<span class="null">(空字串)</span>';
    const shown = s.length > CELL_TRUNCATE ? s.slice(0, CELL_TRUNCATE) + '…' : s;
    return '<span title="' + escapeHtml(s.slice(0, 400)) + '">' + escapeHtml(shown) + '</span>';
  }

  /* ---------- detail modal ---------- */

  function openDetail(rec) {
    const rows = Object.keys(rec).map((k) => {
      const v = rec[k];
      const isNull = v === null || v === undefined;
      const s = isNull ? 'null' : (typeof v === 'object' ? JSON.stringify(v, null, 2) : String(v));
      const long = s.length > LONG_VALUE_CHARS;
      const valueHtml = (!isNull && s === '')
        ? '<span class="null">(空字串)</span>'
        : '<span class="' + (isNull ? 'null' : '') + '">' + escapeHtml(s) + '</span>';
      const copyBtn = (isNull || s === '')
        ? ''
        : '<button type="button" class="btn sm" data-copy="' + escapeHtml(k) + '">複製</button>';
      return '<div class="kv"><div class="k">' + escapeHtml(k) + '</div>' +
        '<div class="v' + (long ? ' long' : '') + '">' + valueHtml + copyBtn + '</div></div>';
    }).join('');

    const back = document.createElement('div');
    back.className = 'backdrop';
    back.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true">' +
      '<div class="modal-head"><h2>記錄明細 <span class="sn">' +
      escapeHtml(String(rec.SN || '')) + '</span></h2>' +
      '<button type="button" class="close-x" aria-label="關閉">&#10005;</button></div>' +
      '<div class="modal-body">' + rows + '</div></div>';

    const onKey = (e) => { if (e.key === 'Escape') close(); };
    function close() {
      back.remove();
      document.removeEventListener('keydown', onKey);
    }

    back.addEventListener('click', (e) => { if (e.target === back) close(); });
    back.querySelector('.close-x').addEventListener('click', close);
    back.querySelectorAll('[data-copy]').forEach((b) => {
      b.addEventListener('click', () => {
        const v = rec[b.dataset.copy];
        copyText(typeof v === 'object' ? JSON.stringify(v, null, 2) : String(v),
          '已複製 ' + b.dataset.copy);
      });
    });

    document.addEventListener('keydown', onKey);
    document.body.appendChild(back);
  }

  /* ---------- export ---------- */

  $('copyBtn').addEventListener('click', () => {
    copyText(JSON.stringify(visibleRows(), null, 2), '已複製 JSON 到剪貼簿');
  });

  $('csvBtn').addEventListener('click', () => {
    const cols = state.columns.filter((c) => !c.hidden).map((c) => c.key);
    const esc = (v) => {
      if (v === null || v === undefined) return '';
      const s = typeof v === 'object' ? JSON.stringify(v) : String(v);
      return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const csv = [cols.join(',')]
      .concat(visibleRows().map((r) => cols.map((k) => esc(r[k])).join(',')))
      .join('\r\n');

    // Prefixed with a BOM so Excel reads it as UTF-8.
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const q = state.lastQuery || {};
    a.href = url;
    a.download = 'cerberus_' + (q.site || 'x') + '_' + (q.type || 'x') + '_' +
      new Date().toISOString().slice(0, 10) + '.csv';
    a.click();
    URL.revokeObjectURL(url);
    toast('CSV 已下載');
  });

  async function copyText(text, okMsg) {
    try {
      await navigator.clipboard.writeText(text);
      toast(okMsg);
    } catch (err) {
      toast('複製失敗：' + err.message, false);
    }
  }

  function highlightJson(value) {
    const json = escapeHtml(JSON.stringify(value, null, 2));
    return json.replace(
      /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g,
      (m) => {
        let cls = 'jn';
        if (/^"/.test(m)) cls = /:$/.test(m) ? 'jk' : 'js';
        else if (/true|false/.test(m)) cls = 'jb';
        else if (/null/.test(m)) cls = 'ju';
        return '<span class="' + cls + '">' + m + '</span>';
      });
  }

  /* ---------- init ---------- */

  if (store('env') === 'dev') document.querySelector('.seg [data-env="dev"]').click();
  const savedSite = store('site');
  if (savedSite) $('site').value = savedSite;
  const savedType = store('type');
  if (savedType) $('type').value = savedType;

  $('epLabel').textContent = endpoint();
  $('sn').focus();
})();
</script>
</body>
</html>
